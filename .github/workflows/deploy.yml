name: Validate and deploy NOVA DIGITEX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check required files
        run: |
          test -s index.html
          test -s modules.js
          test -s general-modules.js
          test -s operations.js
          test -s manifest.json
          test -s supabase/schema.sql
          test -s sw.js
      - name: Check JavaScript syntax
        run: |
          node --check modules.js
          node --check general-modules.js
          node --check operations.js
      - name: Check database migration markers
        run: |
          grep -q 'create table if not exists public.companies' supabase/schema.sql
          grep -q 'create table if not exists public.products' supabase/schema.sql
          grep -q 'function public.register_sale' supabase/schema.sql
          grep -q 'row level security' supabase/schema.sql
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
