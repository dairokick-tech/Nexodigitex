name: Validate and deploy NOVA DIGITEX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nova-digitex-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check required files
        run: |
          test -s index.html
          test -s manifest.json
          test -s sw.js
          grep -q 'Punto de venta' index.html
          grep -q 'Productos e inventario' index.html
      - name: Check embedded application JavaScript syntax
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline application script found")
          for i, script in enumerate(scripts):
              open(f"/tmp/nova-inline-{i}.js", "w", encoding="utf-8").write(script)
          print(f"Found {len(scripts)} inline script(s)")
          PY
          for script in /tmp/nova-inline-*.js; do node --check "$script"; done
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
