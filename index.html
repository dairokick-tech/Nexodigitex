<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2942"><meta name="description" content="NEXO DIGITEX, sistema empresarial y punto de venta."><title>NEXO DIGITEX</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>
:root{--navy:#0b2942;--cyan:#46c5dc;--ink:#172b3b;--muted:#718294;--line:#e2e9ef;--bg:#f4f7fa;--green:#16835d}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:250px;background:var(--navy);color:white;padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0}.brand{font-weight:900;font-size:17px;letter-spacing:.6px;padding:0 8px 24px}.brand b{color:var(--cyan)}.brand small{display:block;color:#a9bdcc;font-size:9px;letter-spacing:2px}.company{border:1px solid #ffffff25;background:#ffffff0b;border-radius:10px;padding:12px;margin-bottom:17px}.company label{font-size:9px;color:#b2c6d5;display:block;margin-bottom:6px}.company select{width:100%;background:#173e59;color:white;border:1px solid #49667a;border-radius:7px;padding:8px}.company button{background:none;color:var(--cyan);border:0;padding:10px 0 0;font-size:12px}.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:#c2d1dc;text-align:left;padding:11px 13px;border-radius:8px}.nav button.active,.nav button:hover{background:#ffffff17;color:white;box-shadow:inset 3px 0 var(--cyan)}.foot{margin-top:auto;color:#9fb5c5;font-size:11px;padding:24px 8px 0}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top strong{color:var(--navy)}.pill{background:#e4f8fb;color:#166579;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:700}.content{width:100%;max-width:1450px;margin:auto;padding:27px 28px;flex:1}.footer{border-top:1px solid var(--line);padding:14px 28px;color:#8b9aa7;font-size:10px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.eyebrow{font-size:10px;color:#1788a3;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.head h1{font-size:26px;color:var(--navy);margin:5px 0}.head p{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700;background:#fff;color:var(--ink)}.primary{background:var(--navy);color:white;border-color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #102b4008}.card{padding:17px}.label{font-size:11px;color:var(--muted)}.value{font-size:25px;font-weight:850;color:var(--navy);margin:10px 0 3px}.hint{font-size:10px;color:var(--muted)}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.panel{padding:18px;min-width:0}.panel h2{font-size:14px;color:var(--navy);margin:0 0 14px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{border:1px solid var(--line);border-radius:9px;background:white;text-align:left;padding:14px}.quick strong,.quick small{display:block}.quick small{font-size:10px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:13px;flex-wrap:wrap}.search{padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:190px;flex:1;max-width:340px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:10px;color:#81909d;background:#f8fafc;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #edf1f5;font-size:12px}.tablewrap{overflow:auto}.empty{text-align:center;color:var(--muted);padding:35px 12px}.empty b{display:block;color:var(--ink);margin-bottom:5px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf7f0;color:var(--green);font-size:10px;font-weight:700}.warn{background:#fff5df;color:#a86c11}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:700;color:#536678}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:white}.field.full{grid-column:1/-1}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;text-align:left}.tile strong,.tile small{display:block}.tile strong{margin:7px 0}.tile small{color:var(--muted)}.tile .price{font-weight:800;color:var(--navy)}.cartline{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.total{display:flex;justify-content:space-between;margin:15px 0;font-weight:800;font-size:20px;color:var(--navy)}.notice{background:#f0fcfe;border:1px solid #bde8ef;color:#2c6573;padding:12px;border-radius:9px;font-size:11px;margin:12px 0}.notice strong{display:block}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:white;border-radius:9px;padding:13px 16px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100% - 24px));box-shadow:0 20px 70px #102b4040}dialog::backdrop{background:#071d2eaa}.modalhead,.modalfoot{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;color:var(--navy);font-size:17px}.modalbody{padding:20px}.modalfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.mobile{display:none}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.side{position:fixed;z-index:5;left:-265px;top:0;bottom:0;transition:.2s;box-shadow:10px 0 30px #0002}.side.open{left:0}.mobile{display:inline-block}.top{height:62px;padding:0 15px}.content{padding:20px 14px}.footer{padding:13px 14px}.head{flex-direction:column}.cols{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:1fr 1fr}.user{display:none}}@media(max-width:400px){.stats{gap:8px}.card{padding:12px}.value{font-size:21px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><div class="shell"><aside class="side" id="side"><div class="brand"><img src="./logo.svg" alt="NEXO DIGITEX" style="display:block;width:100%;max-width:210px;height:auto;margin:0 auto 8px"><small>GESTIÓN EMPRESARIAL</small></div><div class="company"><label>EMPRESA ACTIVA</label><select id="co"></select><button id="newCo">＋ Agregar empresa</button></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦　Resumen</button><button data-page="pos">▣　Punto de venta</button><button data-page="products">▤　Productos e inventario</button><button data-page="customers">♙　Clientes</button><button data-page="suppliers">♧　Proveedores</button><button data-page="cash">▣　Caja</button><button data-page="purchases">⇩　Compras</button><button data-page="reports">▥　Reportes</button><button data-page="settings">⚙　Configuración</button></nav><div class="foot">● Funcionamiento local<br><br>Versión inicial 0.1.0</div></aside><main class="main"><header class="top"><div><button class="btn mobile" id="toggle">☰</button>　<strong id="ptitle">Resumen</strong></div><div><span class="pill" id="network">● Local</span> <span class="user">　Administrador</span></div></header><section class="content" id="view"></section><footer class="footer">NEXO DIGITEX · Base inicial independiente</footer></main></div><div id="toast" class="toast"></div><dialog id="modal"><form id="form" method="dialog"><div class="modalhead"><h2 id="mtitle">Registro</h2><button class="btn" value="cancel">×</button></div><div class="modalbody" id="mbody"></div><div class="modalfoot"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" id="save" value="default">Guardar</button></div></form></dialog>
<script>
(()=>{'use strict';const KEY='nova_digitex_fresh_v1',money=n=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),$=id=>document.getElementById(id);const fresh=()=>({companies:[{id:uid(),name:'Mi empresa',rubro:'Comercio general'}],active:'',products:[],customers:[],suppliers:[],sales:[],cash:[],purchases:[],cashOpen:false,opening:0,settings:{igv:18,taxId:''}});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}if(!s.companies?.length)s=fresh();if(!s.active)s.active=s.companies[0].id;let page='dashboard',term='',cart=[];const co=()=>s.companies.find(x=>x.id===s.active)||s.companies[0],sales=()=>s.sales.filter(x=>x.company===s.active),products=()=>s.products.filter(x=>x.company===s.active);function save(){localStorage.setItem(KEY,JSON.stringify(s));$('co').innerHTML=s.companies.map(c=>'<option value="'+c.id+'" '+(c.id===s.active?'selected':'')+'>'+esc(c.name)+'</option>').join('')}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}function button(t,a,cls='primary'){return '<button class="btn '+(cls==='primary'?'primary':'')+'" data-a="'+a+'">'+t+'</button>'}function head(t,d,actions=''){return '<div class="head"><div><div class="eyebrow">NEXO DIGITEX / '+t+'</div><h1>'+t+'</h1><p>'+d+'</p></div><div class="actions">'+actions+'</div></div>'}function stat(l,v,n){return '<div class="card"><div class="label">'+l+'</div><div class="value">'+v+'</div><div class="hint">'+n+'</div></div>'}function table(rows,heads){if(!rows.length)return '<div class="empty"><b>No hay registros todavía</b>Los datos que registres aparecerán aquí.</div>';return '<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}function recent(){return table(sales().slice().reverse().slice(0,6).map(x=>'<tr><td><b>'+esc(x.number)+'</b></td><td>'+new Date(x.date).toLocaleString('es-PE')+'</td><td>'+esc(x.payment)+'</td><td><b>'+money(x.total)+'</b></td></tr>'),['Venta','Fecha','Pago','Total'])}function dashboard(){return head('Resumen','Actividad del negocio '+esc(co().name),button('＋ Registrar venta','goto-pos')+button('＋ Producto','product-new','light'))+'<div class="stats">'+stat('Ventas registradas',String(sales().length),'Operaciones locales')+stat('Ingresos acumulados',money(sales().reduce((a,x)=>a+x.total,0)),'Ventas de esta empresa')+stat('Productos',products().length,'En catálogo')+stat('Stock bajo',products().filter(p=>p.stock<=p.min).length,'Revisar existencias')+'</div><div class="cols"><div class="panel"><h2>Ventas recientes</h2>'+recent()+'</div><div class="panel"><h2>Accesos rápidos</h2><div class="quick"><button data-a="goto-pos"><strong>▣ Nueva venta</strong><small>Registrar venta</small></button><button data-a="goto-products"><strong>▤ Productos</strong><small>Catálogo e inventario</small></button><button data-a="goto-customers"><strong>♙ Clientes</strong><small>Directorio de clientes</small></button><button data-a="goto-cash"><strong>▣ Caja</strong><small>Apertura y movimientos</small></button></div><div class="notice"><strong>Alcance de esta versión</strong>Los datos se guardan solo en este dispositivo. El servidor, usuarios seguros y sincronización entre dispositivos aún deben implementarse.</div></div></div>'}function searchbar(ph,action,label){return '<div class="toolbar"><input class="search" id="search" placeholder="'+ph+'" value="'+esc(term)+'"><div>'+button('＋ '+label,action)+'</div></div>'}function productPage(){let arr=products().filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(term.toLowerCase()));return head('Productos e inventario','Administra precios, códigos y existencias.',button('＋ Nuevo producto','product-new'))+searchbar('Buscar producto o código…','product-new','Producto')+'<div class="panel">'+table(arr.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.sku||'—')+'</td><td>'+esc(p.category||'General')+'</td><td>'+money(p.price)+'</td><td>'+p.stock+'</td><td><span class="badge '+(p.stock<=p.min?'warn':'')+'">'+(p.stock<=p.min?'Stock bajo':'Disponible')+'</span></td><td><button class="btn" data-a="product-edit" data-id="'+p.id+'">Editar</button></td></tr>'),['Producto','Código','Categoría','Precio','Stock','Estado',''])+'</div>'}function people(type){let arr=(type==='customer'?s.customers:s.suppliers).filter(p=>p.company===s.active&&(p.name+' '+p.doc+' '+p.phone).toLowerCase().includes(term.toLowerCase())),is=type==='customer';return head(is?'Clientes':'Proveedores',is?'Directorio de clientes.':'Contactos comerciales.',button('＋ Nuevo '+(is?'cliente':'proveedor'),type+'-new'))+searchbar('Buscar por nombre, documento o teléfono…',type+'-new',is?'Cliente':'Proveedor')+'<div class="panel">'+table(arr.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.doc||'—')+'</td><td>'+esc(p.phone||'—')+'</td><td>'+esc(p.email||'—')+'</td></tr>'),[is?'Nombre':'Proveedor','DNI/RUC','Teléfono','Correo'])+'</div>'}function pos(){let arr=products().filter(p=>p.name.toLowerCase().includes(term.toLowerCase()));return head('Punto de venta','Selecciona productos para armar la venta.')+'<div class="cols"><div><div class="toolbar"><input id="search" class="search" placeholder="Buscar producto…" value="'+esc(term)+'"></div><div class="products">'+(arr.length?arr.map(p=>'<button class="tile" data-a="cart-add" data-id="'+p.id+'"><small>'+esc(p.sku||'SIN CÓDIGO')+' · Stock '+p.stock+'</small><strong>'+esc(p.name)+'</strong><span class="price">'+money(p.price)+'</span></button>').join(''):'<div class="empty">Registra productos primero.</div>')+'</div></div><div class="panel"><h2>Venta actual</h2>'+(cart.length?cart.map(c=>'<div class="cartline"><span>'+esc(c.name)+' × '+c.qty+'<br><small>'+money(c.price)+'</small></span><span><button class="btn" data-a="minus" data-id="'+c.id+'">−</button> <button class="btn" data-a="plus" data-id="'+c.id+'">+</button></span></div>').join(''):'<div class="empty">Selecciona productos del catálogo.</div>')+'<div class="field"><label>Método de pago</label><select id="payment"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Billetera digital</option></select></div><div class="total"><span>Total</span><span>'+money(cart.reduce((a,c)=>a+c.price*c.qty,0))+'</span></div>'+button('Confirmar venta','sale-finish')+' <button class="btn" data-a="cart-clear">Vaciar</button><p class="hint">No emite comprobantes electrónicos SUNAT.</p></div></div>'}function cashPage(){let arr=s.cash.filter(x=>x.company===s.active),balance=arr.reduce((a,x)=>a+(x.type==='Ingreso'?x.amount:-x.amount),0);return head('Caja','Apertura y movimientos de efectivo.',button(s.cashOpen?'＋ Movimiento':'Abrir caja',s.cashOpen?'cash-move':'cash-open'))+'<div class="stats">'+stat('Estado',s.cashOpen?'Abierta':'Cerrada','Sesión local')+stat('Saldo calculado',money(balance),'Ingresos menos egresos')+stat('Movimientos',arr.length,'Historial de caja')+stat('Ventas',sales().length,'Registradas')+'</div><div class="panel">'+table(arr.slice().reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleString('es-PE')+'</td><td>'+x.type+'</td><td>'+esc(x.note)+'</td><td>'+money(x.amount)+'</td></tr>'),['Fecha','Tipo','Concepto','Monto'])+'</div>'}function purchases(){let arr=s.purchases.filter(x=>x.company===s.active);return head('Compras','Historial básico de compras.',button('＋ Registrar compra','purchase-new'))+'<div class="panel">'+table(arr.slice().reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleDateString('es-PE')+'</td><td>'+esc(x.supplier)+'</td><td>'+esc(x.ref||'—')+'</td><td>'+money(x.total)+'</td></tr>'),['Fecha','Proveedor','Referencia','Total'])+'</div>'}function reports(){let a=sales(),total=a.reduce((v,x)=>v+x.total,0),groups={};a.forEach(x=>groups[x.payment]=(groups[x.payment]||0)+x.total);return head('Reportes','Resumen de los registros locales.',button('Exportar CSV','export','light'))+'<div class="stats">'+stat('Ventas',money(total),'Total acumulado')+stat('Operaciones',a.length,'Transacciones')+stat('Ticket promedio',money(a.length?total/a.length:0),'Por venta')+stat('Productos',products().length,'Catálogo')+'</div><div class="panel"><h2>Ventas por método de pago</h2>'+table(Object.entries(groups).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+money(v)+'</td></tr>'),['Método','Total'])+'</div>'}function settings(){return head('Configuración','Datos básicos y respaldo local.')+'<div class="cols"><div class="panel"><h2>Datos del negocio</h2><form id="settings"><div class="formgrid"><div class="field full"><label>Nombre comercial</label><input name="name" required value="'+esc(co().name)+'"></div><div class="field"><label>RUC</label><input name="tax" value="'+esc(s.settings.taxId||'')+'"></div><div class="field"><label>Rubro</label><select name="rubro">'+['Comercio general','Bodega y minimarket','Ropa y calzado','Ferretería','Restaurante','Farmacia','Librería','Electrónica','Distribuidora','Servicios','Otro'].map(x=>'<option '+(co().rubro===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>IGV (%)</label><input name="igv" type="number" value="'+s.settings.igv+'"></div></div><br><button class="btn primary">Guardar configuración</button></form></div><div class="panel"><h2>Estado del sistema</h2><p class="hint">Almacenamiento: navegador local.</p><p class="hint">Multi-dispositivo y sincronización: pendientes.</p><p class="hint">Autenticación y permisos de servidor: pendientes.</p><p class="hint">SUNAT: integración oficial pendiente.</p>'+button('Descargar respaldo JSON','backup','light')+' <button class="btn" data-a="restore">Importar respaldo</button><input type="file" id="file" hidden accept="application/json"></div></div>'}const pages={dashboard,products:productPage,customers:()=>people('customer'),suppliers:()=>people('supplier'),pos,cash:cashPage,purchases,reports,settings};const titles={dashboard:'Resumen',products:'Productos e inventario',customers:'Clientes',suppliers:'Proveedores',pos:'Punto de venta',cash:'Caja',purchases:'Compras',reports:'Reportes',settings:'Configuración'};function render(){save();$('ptitle').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('view').innerHTML=(pages[page]||dashboard)();$('network').textContent=navigator.onLine?'● Conectado':'● Sin conexión'}function modal(title,html,cb){$('mtitle').textContent=title;$('mbody').innerHTML=html;$('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());if(cb(d)!==false){$('modal').close();save();render()}};$('modal').showModal()}function fld(label,name,type='text',required=false,value='',extra=''){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" '+(required?'required':'')+' value="'+esc(value)+'" '+extra+'></div>'}function productForm(p){p=p||{};modal(p.id?'Editar producto':'Nuevo producto','<div class="formgrid">'+fld('Nombre','name','text',true,p.name)+fld('Código / SKU','sku', 'text',false,p.sku)+fld('Categoría','category','text',false,p.category||'General')+fld('Precio S/','price','number',true,p.price||'','min="0" step=".01"')+fld('Costo S/','cost','number',false,p.cost||0,'min="0" step=".01"')+fld('Stock','stock','number',true,p.stock??0,'min="0" step="1"')+fld('Stock mínimo','min','number',false,p.min??3,'min="0" step="1"')+'</div>',d=>{let x={id:p.id||uid(),company:s.active,name:d.name.trim(),sku:d.sku,category:d.category,price:+d.price,cost:+d.cost,stock:+d.stock,min:+d.min};if(p.id)s.products=s.products.map(z=>z.id===p.id?x:z);else s.products.push(x);toast('Producto guardado')})}function personForm(type){let customer=type==='customer';modal(customer?'Nuevo cliente':'Nuevo proveedor','<div class="formgrid">'+fld(customer?'Nombre completo':'Razón social','name','text',true)+fld('DNI / RUC','doc')+fld('Teléfono','phone','tel')+fld('Correo','email','email')+'</div>',d=>{s[customer?'customers':'suppliers'].push({id:uid(),company:s.active,...d,name:d.name.trim()});toast('Registro guardado')})}function newCompany(){modal('Agregar empresa','<div class="formgrid">'+fld('Nombre de empresa','name','text',true)+'<div class="field"><label>Rubro</label><select name="rubro">'+['Comercio general','Bodega y minimarket','Ropa y calzado','Ferretería','Restaurante','Farmacia','Librería','Electrónica','Distribuidora','Servicios','Otro'].map(x=>'<option>'+x+'</option>').join('')+'</select></div></div><p class="hint">Esta versión separa registros por empresa en el navegador; no es aislamiento seguro en servidor.</p>',d=>{let c={id:uid(),name:d.name.trim(),rubro:d.rubro};s.companies.push(c);s.active=c.id;toast('Empresa agregada')})}function cashOpen(){modal('Abrir caja',fld('Monto inicial S/','amount','number',true,'0','min="0" step=".01"'),d=>{s.cashOpen=true;s.opening=+d.amount;s.cash.push({id:uid(),company:s.active,type:'Ingreso',amount:+d.amount,note:'Apertura',date:new Date().toISOString()});toast('Caja abierta')})}function cashMove(){modal('Movimiento de caja','<div class="formgrid"><div class="field"><label>Tipo</label><select name="type"><option>Ingreso</option><option>Egreso</option></select></div>'+fld('Monto S/','amount','number',true,'','min=".01" step=".01")+ '<div class="field full"><label>Concepto</label><input name="note" required></div></div>',d=>{s.cash.push({id:uid(),company:s.active,type:d.type,amount:+d.amount,note:d.note,date:new Date().toISOString()});toast('Movimiento guardado')})}function purchaseNew(){modal('Registrar compra','<div class="formgrid">'+fld('Proveedor','supplier','text',true)+fld('Referencia','ref')+fld('Total S/','total','number',true,'','min="0" step=".01")+'</div>',d=>{s.purchases.push({id:uid(),company:s.active,...d,total:+d.total,date:new Date().toISOString()});toast('Compra registrada')})}function finishSale(){if(!cart.length)return toast('Agrega productos');if(!s.cashOpen)return toast('Abre caja antes de vender');for(let c of cart){let p=s.products.find(x=>x.id===c.id);if(!p||p.stock<c.qty)return toast('Stock insuficiente: '+c.name)}let total=cart.reduce((a,c)=>a+c.price*c.qty,0),x={id:uid(),number:'V-'+Date.now().toString().slice(-7),company:s.active,items:cart.map(c=>({...c})),total,payment:$('payment').value,date:new Date().toISOString()};x.items.forEach(c=>s.products.find(p=>p.id===c.id).stock-=c.qty);s.sales.push(x);if(x.payment==='Efectivo')s.cash.push({id:uid(),company:s.active,type:'Ingreso',amount:total,note:'Venta '+x.number,date:x.date});cart=[];toast('Venta registrada '+x.number);render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('nova-digitex-respaldo.json',JSON.stringify(s,null,2),'application/json')}function exportCSV(){let csv=[['Numero','Fecha','Pago','Total'],...sales().map(x=>[x.number,x.date,x.payment,x.total])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download('nova-digitex-ventas.csv',csv,'text/csv;charset=utf-8')}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;term='';render();$('side').classList.remove('open')}});$('co').addEventListener('change',e=>{s.active=e.target.value;cart=[];render()});$('newCo').onclick=newCompany;$('toggle').onclick=()=>$('side').classList.toggle('open');$('view').addEventListener('input',e=>{if(e.target.id==='search'){let p=e.target.selectionStart;term=e.target.value;render();let n=$('search');if(n){n.focus();n.setSelectionRange(p,p)}}});$('view').addEventListener('submit',e=>{if(e.target.id==='settings'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));co().name=d.name;co().rubro=d.rubro;s.settings.taxId=d.tax;s.settings.igv=+d.igv;toast('Configuración guardada');render()}});$('view').addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,id=b.dataset.id;if(a.startsWith('goto-')){page=a.slice(5);render()}else if(a==='product-new')productForm();else if(a==='product-edit')productForm(s.products.find(p=>p.id===id));else if(a==='customer-new'||a==='supplier-new')personForm(a.startsWith('customer')?'customer':'supplier');else if(a==='cart-add'){let p=s.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Sin stock');let c=cart.find(x=>x.id===id);if(c){if(c.qty>=p.stock)return toast('Stock máximo');c.qty++}else cart.push({id:p.id,name:p.name,price:p.price,qty:1});render()}else if(a==='plus'){let c=cart.find(x=>x.id===id),p=s.products.find(x=>x.id===id);if(c&&p&&c.qty<p.stock)c.qty++;render()}else if(a==='minus'){let c=cart.find(x=>x.id===id);if(c)c.qty--;cart=cart.filter(x=>x.qty>0);render()}else if(a==='cart-clear'){cart=[];render()}else if(a==='sale-finish')finishSale();else if(a==='cash-open')cashOpen();else if(a==='cash-move')s.cashOpen?cashMove():toast('Abre caja primero');else if(a==='purchase-new')purchaseNew();else if(a==='backup')backup();else if(a==='export')exportCSV();else if(a==='restore')$('file').click()});$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.companies)||!Array.isArray(x.products))throw Error();if(confirm('Esto reemplazará los datos locales actuales. ¿Continuar?')){s=x;render();toast('Respaldo restaurado')}}catch{toast('Archivo de respaldo no válido')}e.target.value=''};window.addEventListener('online',render);window.addEventListener('offline',render);save();render();if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
