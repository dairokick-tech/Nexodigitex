<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b60"><title>NOVA DIGITEX | ERP + POS</title><link rel="manifest" href="./manifest.json"><style>
:root{--navy:#123b60;--navy2:#0b2b47;--blue:#1686d9;--bg:#f2f6fa;--line:#dce5ee;--ink:#172b3d;--muted:#667b8e;--white:#fff;--green:#138653}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 12px;font-weight:650}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:10px;align-items:center;font-weight:850;font-size:17px}.logo{background:#e4f2ff;color:var(--navy);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:900}.brand small{display:block;font-size:10px;color:#c9deee;font-weight:500}.label{font-size:10px;letter-spacing:1.3px;color:#b3cce0;font-weight:800;margin:5px 9px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#dceaf5;text-align:left;font-weight:550}.nav button.active,.nav button:hover{background:#eaf5ff;color:var(--navy)}.sidefoot{margin-top:auto;color:#b6d0e4;font-size:11px}.main{min-width:0}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px;position:sticky;top:0;z-index:2}.search{padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#f9fbfd;width:100%;max-width:400px}.user{font-size:12px;color:var(--muted)}.content{padding:24px;max-width:1450px;margin:auto}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#2475a9;font-weight:850;text-transform:uppercase}.heading{font-size:27px;margin:4px 0 5px;letter-spacing:-.5px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.rubric{background:#fff;border:1px solid #e0e8ef;border-radius:14px;padding:18px 14px;text-align:center;min-height:148px;color:var(--ink);box-shadow:0 3px 10px #163b5c08}.rubric:hover{border-color:#9bcbed;transform:translateY(-2px)}.ico{height:50px;width:50px;margin:0 auto 10px;border-radius:14px;background:#e9f5ff;display:grid;place-items:center;font-size:24px}.rubric strong{display:block;font-size:13px}.rubric small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.primary{background:var(--blue);color:white}.light{background:#edf4f9;color:#254761}.success{background:var(--green);color:white}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}.panel h3{margin:0 0 12px;font-size:15px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;margin-top:5px}.pos{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(290px,1fr);gap:14px;align-items:start}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.product{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;text-align:left;min-height:100px;color:var(--ink)}.product strong{display:block;font-size:12px}.product small{color:var(--muted);display:block;margin:5px 0}.product b{color:#17669f}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.cartrow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #edf1f5;padding:10px 0}.cartrow small{display:block;color:var(--muted)}.qty{display:flex;align-items:center;gap:5px}.qty button{padding:3px 8px;background:#edf4f9}.total{display:flex;justify-content:space-between;font-weight:850;font-size:20px;padding:14px 0;border-top:1px solid var(--line)}.pill{background:#e8f5ff;color:#175c91;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:750}.notice{background:#fff8df;border:1px solid #f0dfa4;border-radius:10px;padding:12px;color:#775b12;font-size:12px;margin-top:15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;border-bottom:1px solid #e9eef3;padding:11px 9px;font-size:12px}th{color:var(--muted);background:#f8fafc}.empty{color:var(--muted);text-align:center;padding:22px}.hidden{display:none}@media(max-width:950px){.app{grid-template-columns:190px 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pos{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{display:none}.top{height:auto;min-height:62px;padding:10px 13px}.top .search{max-width:190px}.content{padding:14px}.heading{font-size:23px}.grid{gap:9px}.rubric{padding:13px 8px;min-height:135px}.rubric strong{font-size:12px}.rubric small{font-size:10px}.metrics{gap:8px}.metric{padding:11px}.metric strong{font-size:19px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">N</div><div>NOVA DIGITEX<small>ERP + POS multirrubro</small></div></div><div><div class="label">EMPRESA</div><button class="light" style="width:100%;text-align:left" onclick="home()">Mi empresa</button></div><div><div class="label">MENÚ PRINCIPAL</div><div class="nav"><button data-v="home" class="active" onclick="home()">⌂ &nbsp; Inicio / Rubros</button><button data-v="stats" onclick="stats()">▥ &nbsp; Estadísticas</button><button data-v="sales" onclick="salesPage()">▣ &nbsp; Historial de ventas</button><button data-v="inventory" onclick="inventoryPage()">▤ &nbsp; Inventario</button><button data-v="customers" onclick="customersPage()">♙ &nbsp; Clientes</button><button data-v="settings" onclick="settingsPage()">⚙ &nbsp; Configuración</button></div></div><div class="sidefoot">NOVA DIGITEX · Prototipo inicial<br>Windows + Android adaptable</div></aside><main class="main"><header class="top"><input id="search" class="search" placeholder="Buscar en el sistema..." oninput="filterAll(this.value)"><div class="user"><span class="pill">● Modo local</span> &nbsp; Administrador</div></header><section id="view" class="content"></section></main></div>
<script>
const R=[
{id:'farmacia',n:'Farmacias y boticas',i:'✚',d:'Medicamentos, lotes y vencimientos',p:[['Paracetamol 500 mg','Medicamentos',3.5],['Alcohol 70% 500 ml','Cuidado personal',7.5],['Vitamina C','Vitaminas',12],['Gasa estéril','Material médico',2.5]]},
{id:'restaurante',n:'Restaurantes y cafeterías',i:'🍴',d:'Mesas, pedidos, comandas e insumos',p:[['Menú del día','Platos',15],['Café americano','Bebidas',5],['Jugo natural','Bebidas',7],['Sándwich mixto','Comidas',9]]},
{id:'bodega',n:'Bodegas y minimarkets',i:'🏪',d:'Ventas rápidas, caja y reposición',p:[['Arroz 1 kg','Abarrotes',4.5],['Aceite 1 L','Abarrotes',8.5],['Agua 625 ml','Bebidas',2],['Leche evaporada','Lácteos',4.2]]},
{id:'tienda',n:'Tiendas y comercios',i:'🛍️',d:'Ventas, compras, clientes y sucursales',p:[['Producto A','General',25],['Producto B','General',39.9],['Accesorio C','Accesorios',12],['Servicio básico','Servicios',20]]},
{id:'ropa',n:'Tiendas de ropa y calzado',i:'👕',d:'Tallas, colores, ventas e inventario',p:[['Polo básico · M azul','Ropa',29.9],['Jeans · talla 32','Ropa',69.9],['Zapatillas · talla 40','Calzado',119],['Gorra','Accesorios',25]]},
{id:'ferreteria',n:'Ferreterías',i:'🔧',d:'Herramientas, materiales y existencias',p:[['Martillo','Herramientas',25],['Tornillos (bolsa)','Fijaciones',8],['Cinta métrica','Herramientas',12],['Pintura 1 galón','Pinturas',65]]},
{id:'mayorista',n:'Mayoristas y distribuidores',i:'🚚',d:'Volúmenes, almacenes, rutas y cobros',p:[['Caja de aceite x12','Abarrotes',96],['Caja de agua x12','Bebidas',20],['Arroz saco 50 kg','Abarrotes',175],['Caja de leche x24','Lácteos',96]]},
{id:'hotel',n:'Hoteles y hospedajes',i:'🏨',d:'Reservas, servicios, cobros y personal',p:[['Habitación simple','Alojamiento',80],['Habitación doble','Alojamiento',130],['Desayuno','Servicios',15],['Lavandería','Servicios',10]]},
{id:'servicios',n:'Servicios y oficinas',i:'💼',d:'Clientes, cotizaciones, cobros y equipo',p:[['Servicio profesional','Servicios',100],['Consulta técnica','Servicios',60],['Impresión A4','Oficina',0.5],['Paquete mensual','Servicios',250]]},
{id:'logistica',n:'Almacenes y logística',i:'📦',d:'Entradas, salidas, transferencias y kardex',p:[['Servicio de almacenaje','Logística',30],['Preparación de pedido','Logística',8],['Embalaje','Materiales',5],['Despacho local','Transporte',15]]},
{id:'libreria',n:'Librerías y útiles',i:'📚',d:'Catálogo, códigos de barras y reposición',p:[['Cuaderno A4','Útiles',6.5],['Lapicero azul','Útiles',1.5],['Libro de lectura','Libros',28],['Kit escolar','Kits',45]]}
];
let active=null,cart=[],view='home',query='';
const $=x=>document.getElementById(x), money=n=>'S/ '+Number(n||0).toFixed(2);
function nav(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}
function home(){view='home';active=null;nav('home');$('search').value='';query='';$('view').innerHTML='<div class="eyebrow">NOVA DIGITEX · Administración multirrubro</div><h1 class="heading">Selecciona un rubro</h1><p class="sub">Cada rubro cuenta con su propio punto de venta especializado.</p><div id="rubrics" class="grid"></div><div class="notice">Versión inicial de demostración. Los datos se guardan solo en este navegador; no es todavía un sistema de producción ni emite comprobantes electrónicos SUNAT.</div>';drawRubrics()}
function drawRubrics(){$('rubrics').innerHTML=R.filter(r=>(r.n+' '+r.d).toLowerCase().includes(query)).map(r=>'<button class="rubric" onclick="openPOS(\''+r.id+'\')"><div class="ico">'+r.i+'</div><strong>'+r.n+'</strong><small>'+r.d+'</small></button>').join('')||'<div class="empty">No se encontraron rubros.</div>'}
function openPOS(id){active=R.find(r=>r.id===id);cart=[];view='pos';nav('');renderPOS()}
function renderPOS(){const r=active;$('view').innerHTML='<div class="eyebrow">'+r.n+' · Punto de venta</div><h1 class="heading">POS de ventas</h1><p class="sub">Caja adaptada a '+r.n.toLowerCase()+'.</p><div class="toolbar"><button class="light" onclick="home()">← Cambiar rubro</button><button class="light" onclick="salesPage()">Historial</button><button class="light" onclick="inventoryPage()">Inventario</button><span class="pill">Caja demo · Cajero 01</span></div><div class="metrics"><div class="metric"><span>Productos demo</span><strong>'+r.p.length+'</strong></div><div class="metric"><span>Unidades en carrito</span><strong id="count">0</strong></div><div class="metric"><span>Total de venta</span><strong id="metricTotal">S/ 0.00</strong></div><div class="metric"><span>Conectividad</span><strong style="font-size:16px">Local</strong></div></div><div class="pos"><div class="panel"><h3>Catálogo de productos</h3><div class="toolbar"><input id="psearch" class="search" placeholder="Buscar producto..." oninput="drawProducts(this.value)"></div><div id="products" class="products"></div></div><div class="panel"><h3>Venta actual</h3><div class="field"><label>Cliente (opcional)</label><input id="customer" placeholder="Nombre o razón social"></div><div class="field"><label>Medio de pago</label><select id="payment"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Billetera digital</option><option>Pago mixto</option><option>Crédito autorizado</option></select></div><div id="cartItems"></div><div class="total"><span>Total</span><span id="cartTotal">S/ 0.00</span></div><button class="success" style="width:100%" onclick="completeSale()">✓ Confirmar venta local</button><button class="light" style="width:100%;margin-top:8px" onclick="clearCart()">Vaciar carrito</button></div></div><div class="notice">Los productos y precios son de ejemplo. No usar para operaciones reales hasta integrar servidor, permisos, impresión y SUNAT.</div>';drawProducts('');drawCart()}
function drawProducts(q=''){if(!active)return;const ps=active.p.filter(p=>(p[0]+' '+p[1]).toLowerCase().includes(q.toLowerCase()));$('products').innerHTML=ps.map(p=>'<button class="product" onclick="addCart(\''+p[0].replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')"><strong>'+p[0]+'</strong><small>'+p[1]+'</small><b>'+money(p[2])+'</b><small>＋ Agregar</small></button>').join('')||'<div class="empty">No hay coincidencias.</div>'}
function addCart(name){const p=active.p.find(x=>x[0]===name),f=cart.find(x=>x.name===name);if(f)f.qty++;else cart.push({name:p[0],category:p[1],price:p[2],qty:1});drawCart()}
function changeQty(i,n){cart[i].qty+=n;if(cart[i].qty<1)cart.splice(i,1);drawCart()}
function clearCart(){cart=[];drawCart()}
function drawCart(){if(!$('cartItems'))return;const total=cart.reduce((s,p)=>s+p.price*p.qty,0);$('cartItems').innerHTML=cart.length?cart.map((p,i)=>'<div class="cartrow"><div><strong>'+p.name+'</strong><small>'+money(p.price)+' c/u</small></div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><span>'+p.qty+'</span><button onclick="changeQty('+i+',1)">+</button><b>'+money(p.price*p.qty)+'</b></div></div>').join(''):'<div class="empty">Agrega productos para iniciar la venta.</div>';$('cartTotal').textContent=money(total);$('metricTotal').textContent=money(total);$('count').textContent=cart.reduce((s,p)=>s+p.qty,0)}
function getSales(){try{return JSON.parse(localStorage.getItem('nova_sales')||'[]')}catch(e){return []}}
function completeSale(){if(!cart.length){alert('Agrega al menos un producto.');return}const all=getSales(),total=cart.reduce((s,p)=>s+p.price*p.qty,0),s={id:'NV-'+Date.now(),date:new Date().toLocaleString('es-PE'),rubric:active.n,customer:$('customer').value||'Público general',payment:$('payment').value,items:cart.map(p=>({...p})),total};all.unshift(s);localStorage.setItem('nova_sales',JSON.stringify(all));alert('Venta de prueba guardada: '+s.id+' · '+money(total));cart=[];renderPOS()}
function salesPage(){view='sales';nav('sales');const s=getSales();$('view').innerHTML='<div class="eyebrow">Operaciones · Registro local</div><h1 class="heading">Historial de ventas</h1><p class="sub">Ventas guardadas en este dispositivo.</p><div class="toolbar"><button class="light" onclick="home()">← Inicio</button><button class="primary" onclick="exportCSV()">Exportar CSV</button></div><div class="panel tablewrap"><table><thead><tr><th>Operación</th><th>Fecha</th><th>Rubro</th><th>Cliente</th><th>Pago</th><th>Total</th></tr></thead><tbody>'+(s.map(x=>'<tr><td>'+x.id+'</td><td>'+x.date+'</td><td>'+x.rubric+'</td><td>'+esc(x.customer)+'</td><td>'+x.payment+'</td><td><b>'+money(x.total)+'</b></td></tr>').join('')||'<tr><td colspan="6" class="empty">Aún no hay ventas.</td></tr>')+'</tbody></table></div><div class="notice">El historial no se sincroniza con otros dispositivos en esta versión.</div>'}
function exportCSV(){const s=getSales(),rows=[['id','fecha','rubro','cliente','pago','total'],...s.map(x=>[x.id,x.date,x.rubric,x.customer,x.payment,x.total])],csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='nova_ventas.csv';a.click();URL.revokeObjectURL(a.href)}
function inventoryPage(){view='inventory';nav('inventory');$('view').innerHTML='<div class="eyebrow">Control de existencias</div><h1 class="heading">Inventario de demostración</h1><p class="sub">Consulta el catálogo por rubro.</p><div class="toolbar"><button class="light" onclick="home()">← Inicio</button><select class="search" id="ir" style="max-width:360px" onchange="drawInventory()">'+R.map(r=>'<option value="'+r.id+'" '+(active&&active.id===r.id?'selected':'')+'>'+r.n+'</option>').join('')+'</select></div><div class="panel tablewrap" id="invtable"></div><div class="notice">Existencias ilustrativas; aún no hay kardex persistente ni sincronización de inventario.</div>';drawInventory()}
function drawInventory(){if(!$('ir'))return;const r=R.find(x=>x.id===$('ir').value);$('invtable').innerHTML='<table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio demo</th><th>Stock demo</th></tr></thead><tbody>'+r.p.map((p,i)=>'<tr><td>'+p[0]+'</td><td>'+p[1]+'</td><td>'+money(p[2])+'</td><td>'+(20+i*7)+'</td></tr>').join('')+'</tbody></table>'}
function getCustomers(){try{return JSON.parse(localStorage.getItem('nova_customers')||'[]')}catch(e){return []}}
function customersPage(){view='customers';nav('');$('view').innerHTML='<div class="eyebrow">Relación comercial</div><h1 class="heading">Clientes</h1><p class="sub">Registro local de demostración.</p><div class="panel"><form onsubmit="addCustomer(event)"><div class="field"><label>Nombre o razón social</label><input id="cn" required></div><div class="field"><label>DNI/RUC (opcional)</label><input id="cd"></div><div class="field"><label>Teléfono (opcional)</label><input id="ct"></div><button class="primary">Guardar cliente</button></form></div><div class="panel tablewrap" id="ctable"></div>';drawCustomers()}
function addCustomer(e){e.preventDefault();const c=getCustomers();c.push({n:$('cn').value,d:$('cd').value,t:$('ct').value});localStorage.setItem('nova_customers',JSON.stringify(c));drawCustomers();e.target.reset()}
function drawCustomers(){if(!$('ctable'))return;const c=getCustomers();$('ctable').innerHTML='<table><thead><tr><th>Cliente</th><th>Documento</th><th>Teléfono</th></tr></thead><tbody>'+(c.map(x=>'<tr><td>'+esc(x.n)+'</td><td>'+esc(x.d)+'</td><td>'+esc(x.t)+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No hay clientes registrados.</td></tr>')+'</tbody></table>'}
function stats(){view='stats';nav('stats');const s=getSales(),total=s.reduce((a,x)=>a+x.total,0);$('view').innerHTML='<div class="eyebrow">Resumen empresarial</div><h1 class="heading">Estadísticas</h1><p class="sub">Indicadores basados en ventas locales de prueba.</p><div class="metrics"><div class="metric"><span>Ventas</span><strong>'+s.length+'</strong></div><div class="metric"><span>Importe acumulado</span><strong>'+money(total)+'</strong></div><div class="metric"><span>Rubros</span><strong>11</strong></div><div class="metric"><span>Datos</span><strong style="font-size:16px">Local</strong></div></div><div class="panel"><h3>Ventas por rubro</h3>'+R.map(r=>{const n=s.filter(x=>x.rubric===r.n).reduce((a,x)=>a+x.total,0);return '<p style="display:flex;justify-content:space-between;border-bottom:1px solid #edf1f5;padding:8px 0"><span>'+r.n+'</span><b>'+money(n)+'</b></p>'}).join('')+'</div>'}
function settingsPage(){view='settings';nav('');$('view').innerHTML='<div class="eyebrow">Administración</div><h1 class="heading">Configuración</h1><p class="sub">Datos de demostración de NOVA DIGITEX.</p><div class="panel"><div class="field"><label>Nombre comercial</label><input value="NOVA DIGITEX" readonly></div><div class="field"><label>Moneda</label><input value="Soles peruanos (PEN)" readonly></div><div class="field"><label>Plataforma prevista</label><input value="Windows + Android" readonly></div></div><div class="panel"><h3>Antes de producción</h3><p>Faltan servidor y SQL central, sincronización offline idempotente, usuarios y permisos seguros, auditoría, copias de seguridad, impresión integrada y conexión certificada con SUNAT.</p></div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filterAll(v){query=v.toLowerCase();if(view==='home')drawRubrics();if(view==='pos')drawProducts(v)}
home();
</script></body></html>
