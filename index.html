let active=null,cart=[],view='home',query='',sb=null,currentUser=null;
const $=x=>document.getElementById(x),money=n=>'S/ '+Number(n||0).toFixed(2);
function nav(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}
function setAccent(r){document.documentElement.style.setProperty('--accent',r?.c||'#147bd1');document.documentElement.style.setProperty('--soft',r?.s||'#e8f3fc')}
function config(){try{return JSON.parse(localStorage.getItem('nova_supabase')||'{}')}catch(e){return {}}}
function setStatus(t,kind=''){const el=$('syncBadge');el.textContent=t;el.className='sync '+kind}
async function initSupabase(){const c=config();if(!c.url||!c.key||!window.supabase){sb=null;setStatus('● Modo local');$('userLabel').textContent='Configura Supabase';return}try{sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;sb.auth.onAuthStateChange((_e,session)=>{currentUser=session?.user||null;updateUser();if(currentUser)syncQueue()});updateUser();setStatus('● Supabase configurado','ok')}catch(e){sb=null;setStatus('● Error de conexión','err')}}
function updateUser(){$('userLabel').textContent=currentUser?(currentUser.email||'Sesión iniciada'):'Sesión no iniciada';if(sb&&!currentUser)setStatus('● Supabase · sin sesión')}
function home(){view='home';active=null;setAccent(null);nav('home');$('search').value='';query='';$('view').innerHTML='<div class="eyebrow">NOVA DIGITEX · Administración multirrubro</div><h1 class="heading">11 rubros · 11 POS especializados</h1><p class="sub">Selecciona un rubro para entrar a su punto de venta. Cada uno tiene identidad de color y herramientas adaptadas a su operación.</p><div id="rubrics" class="grid"></div><div class="notice">La aplicación permite modo local y conexión opcional a Supabase. Para sincronizar datos entre dispositivos, configura el proyecto Supabase, ejecuta <b>supabase/schema.sql</b> y crea una cuenta de usuario. No se deben usar claves secretas de Supabase en esta página.</div>';drawRubrics()}
function drawRubrics(){$('rubrics').innerHTML=R.filter(r=>(r.n+' '+r.d+' '+r.features.join(' ')).toLowerCase().includes(query)).map(r=>'<button class="rubric" style="--accent:'+r.c+';--soft:'+r.s+'" onclick="openPOS(\''+r.id+'\')"><div class="rubrichead"><div class="ico">'+r.i+'</div><div><strong>'+r.n+'</strong><small>'+r.d+'</small></div></div><small>'+r.features.slice(0,3).join(' · ')+'</small><div class="open">Abrir POS →</div></button>').join('')||'<div class="empty">No se encontraron rubros.</div>'}
function openPOS(id){active=R.find(r=>r.id===id);cart=[];view='pos';setAccent(active);nav('');renderPOS()}
function renderPOS(){const r=active;$('view').innerHTML='<div class="eyebrow">'+r.n+' · Punto de venta especializado</div><h1 class="heading">POS de ventas</h1><p class="sub">'+r.d+'.</p><div class="toolbar"><button class="light" onclick="home()">← Rubros</button><button class="light" onclick="salesPage()">Historial</button><button class="light" onclick="inventoryPage()">Inventario</button><span class="pill" style="background:'+r.s+';color:'+r.c+'">● POS '+r.n+'</span></div><div class="metrics"><div class="metric"><span>Productos demo</span><strong>'+r.p.length+'</strong></div><div class="metric"><span>Unidades en carrito</span><strong id="count">0</strong></div><div class="metric"><span>Total actual</span><strong id="metricTotal">S/ 0.00</strong></div><div class="metric"><span>Estado de conexión</span><strong style="font-size:15px">'+(sb?'Supabase':'Local')+'</strong></div></div><div class="panel"><h3>Funciones de este rubro</h3><div style="display:flex;gap:7px;flex-wrap:wrap">'+r.features.map(f=>'<span class="pill" style="background:'+r.s+';color:'+r.c+'">'+f+'</span>').join('')+'</div></div><div class="pos"><div class="panel"><h3>Catálogo de productos</h3><div class="toolbar"><input id="psearch" class="search" placeholder="Buscar producto..." oninput="drawProducts(this.value)"></div><div id="products" class="products"></div></div><div class="panel"><h3>Venta actual</h3><div class="field"><label>Cliente (opcional)</label><input id="customer" placeholder="Nombre o razón social"></div><div class="field"><label>Medio de pago</label><select id="payment"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Billetera digital</option><option>Pago mixto</option><option>Crédito autorizado</option></select></div><div id="cartItems"></div><div class="total"><span>Total</span><span id="cartTotal">S/ 0.00</span></div><button class="success" style="width:100%" onclick="completeSale()">✓ Confirmar venta</button><button class="light" style="width:100%;margin-top:8px" onclick="clearCart()">Vaciar carrito</button></div></div><div class="notice">Los productos y precios mostrados son datos de ejemplo. No emitir comprobantes reales desde esta versión.</div>';drawProducts('');drawCart()}
function drawProducts(q=''){if(!active||!$('products'))return;const ps=active.p.filter(p=>(p[0]+' '+p[1]).toLowerCase().includes(q.toLowerCase()));$('products').innerHTML=ps.map((p,i)=>'<button class="product" style="--accent:'+active.c+'" onclick="addCart('+i+')"><strong>'+p[0]+'</strong><small>'+p[1]+'</small><b>'+money(p[2])+'</b><small>＋ Agregar</small></button>').join('')||'<div class="empty">No hay coincidencias.</div>'}
function addCart(i){const p=active.p.filter(p=>(p[0]+' '+p[1]).toLowerCase().includes(($('psearch')?.value||'').toLowerCase()))[i];if(!p)return;const f=cart.find(x=>x.name===p[0]);if(f)f.qty++;else cart.push({name:p[0],category:p[1],price:p[2],qty:1});drawCart()}
function changeQty(i,n){cart[i].qty+=n;if(cart[i].qty<1)cart.splice(i,1);drawCart()}
function clearCart(){cart=[];drawCart()}
function drawCart(){if(!$('cartItems'))return;const total=cart.reduce((s,p)=>s+p.price*p.qty,0);$('cartItems').innerHTML=cart.length?cart.map((p,i)=>'<div class="cartrow"><div><strong>'+p.name+'</strong><small>'+money(p.price)+' c/u</small></div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><span>'+p.qty+'</span><button onclick="changeQty('+i+',1)">+</button><b>'+money(p.price*p.qty)+'</b></div></div>').join(''):'<div class="empty">Agrega productos para iniciar la venta.</div>';$('cartTotal').textContent=money(total);$('metricTotal').textContent=money(total);$('count').textContent=cart.reduce((s,p)=>s+p.qty,0)}
function getSales(){try{return JSON.parse(localStorage.getItem('nova_sales')||'[]')}catch(e){return []}}
function saveQueue(s){const q=JSON.parse(localStorage.getItem('nova_queue')||'[]');if(!q.some(x=>x.id===s.id))q.push(s);localStorage.setItem('nova_queue',JSON.stringify(q))}
async function completeSale(){if(!cart.length){alert('Agrega al menos un producto.');return}const all=getSales(),total=cart.reduce((s,p)=>s+p.price*p.qty,0),s={id:crypto.randomUUID?crypto.randomUUID():'nv-'+Date.now()+'-'+Math.random().toString(16).slice(2),created_at:new Date().toISOString(),rubric_id:active.id,rubric_name:active.n,customer_name:$('customer').value||'Público general',payment_method:$('payment').value,items:cart.map(p=>({...p})),total,status:'local'};all.unshift(s);localStorage.setItem('nova_sales',JSON.stringify(all));saveQueue(s);cart=[];renderPOS();if(sb&&currentUser)await syncQueue();alert('Venta guardada localmente. '+(sb&&currentUser?'Se intentará sincronizar con Supabase.':'Se sincronizará cuando configures Supabase e inicies sesión.'))}
async function syncQueue(){if(!sb||!currentUser)return;let q=JSON.parse(localStorage.getItem('nova_queue')||'[]');if(!q.length){setStatus('● Sincronizado','ok');return}setStatus('↻ Sincronizando...');let left=[];for(const s of q){const payload={id:s.id,user_id:currentUser.id,rubric_id:s.rubric_id,rubric_name:s.rubric_name,customer_name:s.customer_name,payment_method:s.payment_method,items:s.items,total:s.total,created_at:s.created_at};const {error}=await sb.from('sales').upsert(payload,{onConflict:'id'});if(error){left.push(s)}else{const all=getSales().map(x=>x.id===s.id?{...x,status:'synced'}:x);localStorage.setItem('nova_sales',JSON.stringify(all))}}localStorage.setItem('nova_queue',JSON.stringify(left));setStatus(left.length?'● Pendiente de sincronizar':'● Supabase sincronizado',left.length?'err':'ok')}
function salesPage(){view='sales';nav('sales');setAccent(null);const s=getSales();$('view').innerHTML='<div class="eyebrow">Operaciones · Registro de ventas</div><h1 class="heading">Historial de ventas</h1><p class="sub">Registro de ventas guardadas en este dispositivo.</p><div class="toolbar"><button class="light" onclick="home()">← Inicio</button><button class="primary" onclick="exportCSV()">Exportar CSV</button><button class="success" onclick="syncQueue()">Sincronizar ahora</button></div><div class="panel tablewrap"><table><thead><tr><th>Operación</th><th>Fecha</th><th>Rubro</th><th>Cliente</th><th>Pago</th><th>Estado</th><th>Total</th></tr></thead><tbody>'+(s.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+new Date(x.created_at||Date.now()).toLocaleString('es-PE')+'</td><td>'+esc(x.rubric_name||x.rubric)+'</td><td>'+esc(x.customer_name||x.customer)+'</td><td>'+esc(x.payment_method||x.payment)+'</td><td>'+esc(x.status||'local')+'</td><td><b>'+money(x.total)+'</b></td></tr>').join('')||'<tr><td colspan="7" class="empty">Aún no hay ventas.</td></tr>')+'</tbody></table></div><div class="notice">La cola local evita perder temporalmente ventas en este navegador; antes de uso comercial, debe probarse la recuperación y sincronización entre varios dispositivos.</div>'}
function exportCSV(){const s=getSales(),rows=[['id','fecha','rubro','cliente','pago','estado','total'],...s.map(x=>[x.id,x.created_at||x.date,x.rubric_name||x.rubric,x.customer_name||x.customer,x.payment_method||x.payment,x.status,x.total])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='nova_ventas.csv';a.click();URL.revokeObjectURL(a.href)}
function inventoryPage(){view='inventory';nav('inventory');setAccent(null);$('view').innerHTML='<div class="eyebrow">Control de existencias</div><h1 class="heading">Inventario de demostración</h1><p class="sub">Catálogo de ejemplo por rubro.</p><div class="toolbar"><button class="light" onclick="home()">← Inicio</button><select class="search" id="ir" style="max-width:360px" onchange="drawInventory()">'+R.map(r=>'<option value="'+r.id+'" '+(active&&active.id===r.id?'selected':'')+'>'+r.n+'</option>').join('')+'</select></div><div class="panel tablewrap" id="invtable"></div><div class="notice">El inventario real debe persistirse en Supabase con movimientos de kardex, entradas, salidas y permisos.</div>';drawInventory()}
function drawInventory(){if(!$('ir'))return;const r=R.find(x=>x.id===$('ir').value);$('invtable').innerHTML='<table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio demo</th><th>Stock demo</th></tr></thead><tbody>'+r.p.map((p,i)=>'<tr><td>'+p[0]+'</td><td>'+p[1]+'</td><td>'+money(p[2])+'</td><td>'+(20+i*7)+'</td></tr>').join('')+'</tbody></table>'}
function getCustomers(){try{return JSON.parse(localStorage.getItem('nova_customers')||'[]')}catch(e){return []}}
function customersPage(){view='customers';nav('customers');setAccent(null);$('view').innerHTML='<div class="eyebrow">Relación comercial</div><h1 class="heading">Clientes</h1><p class="sub">Registros locales; las ventas pueden sincronizarse con Supabase.</p><div class="panel"><form onsubmit="addCustomer(event)"><div class="field"><label>Nombre o razón social</label><input id="cn" required></div><div class="field"><label>DNI/RUC (opcional)</label><input id="cd"></div><div class="field"><label>Teléfono (opcional)</label><input id="ct"></div><button class="primary">Guardar cliente</button></form></div><div class="panel tablewrap" id="ctable"></div>';drawCustomers()}
async function addCustomer(e){e.preventDefault();const c=getCustomers(),item={id:crypto.randomUUID?crypto.randomUUID():'c-'+Date.now(),n:$('cn').value,d:$('cd').value,t:$('ct').value};c.push(item);localStorage.setItem('nova_customers',JSON.stringify(c));if(sb&&currentUser){const {error}=await sb.from('customers').upsert({id:item.id,user_id:currentUser.id,name:item.n,document_number:item.d,phone:item.t},{onConflict:'id'});if(error)alert('Cliente guardado localmente; Supabase: '+error.message)}drawCustomers();e.target.reset()}
function drawCustomers(){if(!$('ctable'))return;const c=getCustomers();$('ctable').innerHTML='<table><thead><tr><th>Cliente</th><th>Documento</th><th>Teléfono</th></tr></thead><tbody>'+(c.map(x=>'<tr><td>'+esc(x.n)+'</td><td>'+esc(x.d)+'</td><td>'+esc(x.t)+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No hay clientes registrados.</td></tr>')+'</tbody></table>'}
function stats(){view='stats';nav('stats');setAccent(null);const s=getSales(),total=s.reduce((a,x)=>a+x.total,0);$('view').innerHTML='<div class="eyebrow">Resumen empresarial</div><h1 class="heading">Estadísticas</h1><p class="sub">Indicadores calculados desde ventas locales.</p><div class="metrics"><div class="metric"><span>Ventas registradas</span><strong>'+s.length+'</strong></div><div class="metric"><span>Importe acumulado</span><strong>'+money(total)+'</strong></div><div class="metric"><span>Rubros</span><strong>11</strong></div><div class="metric"><span>Estado</span><strong style="font-size:16px">'+(sb?'Supabase':'Local')+'</strong></div></div><div class="panel"><h3>Ventas por rubro</h3>'+R.map(r=>{const n=s.filter(x=>(x.rubric_id===r.id)||(x.rubric===r.n)).reduce((a,x)=>a+x.total,0);return '<p style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #edf1f5;padding:9px 0"><span style="color:'+r.c+';font-weight:750">'+r.n+'</span><b>'+money(n)+'</b></p>'}).join('')+'</div>'}
function settingsPage(){view='settings';nav('settings');setAccent(null);const c=config();$('view').innerHTML='<div class="eyebrow">Conexión de datos</div><h1 class="heading">Supabase y configuración</h1><p class="sub">Introduce la URL de tu proyecto y la clave pública (publishable/anon). No pegues aquí la service_role ni ninguna clave secreta.</p><div class="panel"><h3>1. Conectar proyecto Supabase</h3><form onsubmit="saveConfig(event)"><div class="field"><label>Project URL</label><input id="sburl" type="url" placeholder="https://tu-proyecto.supabase.co" value="'+esc(c.url||'')+'" required></div><div class="field"><label>Publishable key / anon public key</label><input id="sbkey" placeholder="sb_publishable_... o clave anon pública" value="'+esc(c.key||'')+'" required></div><button class="primary">Guardar y conectar</button><button type="button" class="light" onclick="disconnect()">Desconectar</button></form><p id="connmsg" class="sub" style="margin-top:12px;margin-bottom:0"></p></div><div class="panel"><h3>2. Cuenta de usuario</h3><p class="sub">Supabase Auth debe estar habilitado. Crea una cuenta de administrador; las ventas quedan asociadas a su usuario.</p><form onsubmit="authSubmit(event)"><div class="field"><label>Correo electrónico</label><input id="authEmail" type="email" required autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="authPass" type="password" minlength="8" required autocomplete="current-password"></div><div class="toolbar"><button class="primary" type="submit" data-auth="in">Iniciar sesión</button><button class="light" type="button" onclick="signUp()">Crear cuenta</button><button class="danger" type="button" onclick="signOut()">Cerrar sesión</button></div></form><p id="authmsg" class="sub" style="margin-bottom:0"></p></div><div class="panel"><h3>3. Preparar base de datos</h3><p>En el repositorio abre <b>supabase/schema.sql</b>, copia el SQL y ejecútalo en el SQL Editor de tu proyecto Supabase. Luego configura URL y clave pública arriba.</p><div class="toolbar"><a href="https://supabase.com/dashboard" target="_blank" rel="noopener"><button class="light" type="button">Abrir Supabase Dashboard ↗</button></a><button class="success" onclick="syncQueue()">Sincronizar cola local</button></div></div><div class="notice">Seguridad: la clave pública puede estar en el navegador solo si las políticas RLS están activas. Este proyecto nunca debe incluir la service_role key. La configuración queda guardada en este dispositivo.</div>'}
async function saveConfig(e){e.preventDefault();const url=$('sburl').value.trim().replace(/\/$/,''),key=$('sbkey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){alert('Verifica la URL de Supabase.');return}localStorage.setItem('nova_supabase',JSON.stringify({url,key}));await initSupabase();$('connmsg').textContent=sb?'Cliente Supabase configurado. Ahora inicia sesión y ejecuta schema.sql.':'No se pudo inicializar Supabase; verifica URL, clave y conexión.'}
function disconnect(){if(sb)sb.auth.signOut();localStorage.removeItem('nova_supabase');sb=null;currentUser=null;updateUser();setStatus('● Modo local');settingsPage()}
async function authSubmit(e){e.preventDefault();if(!sb){$('authmsg').textContent='Primero guarda la configuración de Supabase.';return}const {data,error}=await sb.auth.signInWithPassword({email:$('authEmail').value,password:$('authPass').value});$('authmsg').textContent=error?error.message:'Sesión iniciada correctamente.';if(!error){currentUser=data.user;updateUser();await syncQueue()}}
async function signUp(){if(!sb){$('authmsg').textContent='Primero guarda la configuración de Supabase.';return}const {data,error}=await sb.auth.signUp({email:$('authEmail').value,password:$('authPass').value});$('authmsg').textContent=error?error.message:(data.session?'Cuenta creada y sesión iniciada.':'Cuenta creada. Revisa tu correo si la confirmación está activada.');if(data.user){currentUser=data.user;updateUser()}}
async function signOut(){if(sb)await sb.auth.signOut();currentUser=null;updateUser();$('authmsg').textContent='Sesión cerrada.'}
function filterAll(v){query=v.toLowerCase();if(view==='home')drawRubrics();if(view==='pos')drawProducts(v)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.addEventListener('online',()=>{if(sb&&currentUser)syncQueue()});initSupabase().then(home);
