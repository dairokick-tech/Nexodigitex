:1.5px;text-transform:uppercase}.head h1{font-size:26px;color:var(--navy);margin:5px 0}.head p{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:12px;font-weight:700;background:#fff;color:var(--ink)}.primary{background:var(--navy);color:white;border-color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #102b4008}.card{padding:17px}.label{font-size:11px;color:var(--muted)}.value{font-size:25px;font-weight:850;color:var(--navy);margin:10px 0 3px}.hint{font-size:10px;color:var(--muted)}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.panel{padding:18px;min-width:0}.panel h2{font-size:14px;color:var(--navy);margin:0 0 14px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{border:1px solid var(--line);border-radius:9px;background:white;text-align:left;padding:14px}.quick strong,.quick small{display:block}.quick small{font-size:10px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:13px;flex-wrap:wrap}.search{padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:190px;flex:1;max-width:340px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:10px;color:#81909d;background:#f8fafc;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #edf1f5;font-size:12px}.tablewrap{overflow:auto}.empty{text-align:center;color:var(--muted);padding:35px 12px}.empty b{display:block;color:var(--ink);margin-bottom:5px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf7f0;color:var(--green);font-size:10px;font-weight:700}.warn{background:#fff5df;color:#a86c11}.formgrid{display:grid;grid-template-columns:1 ction:column}.cols{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:1fr 1fr}.user{display:none}}@media(max-width:400px){.stats{gap:8px}.card{padding:12px}.value{font-size:21px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}

.login-screen{min-height:100vh;background:#f4f4f4;display:flex;align-items:center;justify-content:center;padding:22px;font-family:Arial,sans-serif}
.login-card{width:min(820px,100%);background:#fff;border:2px solid #b8b8b8;box-shadow:0 8px 25px #0001;padding:26px 30px;position:relative}
.login-title{text-align:center;color:#8b7930;font-size:25px;font-weight:700;margin:0 0 28px}
.login-inner{display:grid;grid-template-columns:1fr 1.2fr;gap:26px;align-items:center}
.login-illustration{text-align:center;font-size:90px;line-height:1.2;color:#607d8b}
.login-illustration small{display:block;font-size:12px;color:#777;margin-top:12px}
.login-form{border:1px solid #d6d6d6;padding:22px;background:#fff}
.login-field{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;margin:0 0 17px}
.login-field label{font-weight:700;color:#6c6c55;text-align:right}
.login-field input{width:100%;min-width:0;border:2px solid #c9b56c;padding:11px;border-radius:0;background:#fff}
.login-actions{display:flex;gap:12px;justify-content:center;margin-top:20px}
.login-actions button{min-width:120px;padding:11px;border:1px solid #ccc;font-weight:700}
.login-submit{background:#1e84bc;color:#fff!important;border-color:#176c99!important}
.login-reset{background:#eee;color:#8d3b35}
.login-foot{text-align:center;color:#8c7c3b;font-weight:700;margin-top:22px}
.login-error{color:#b42318;text-align:center;font-size:12px;min-height:18px;margin-top:10px}
.home-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:28px}
.home-tile{min-height:175px;border:1px solid #e2e2e2;background:#fff;box-shadow:0 2px 3px #0001;text-align:center;padding:17px 10px;cursor:pointer;color:#333}
.home-tile:hover{box-shadow:0 5px 15px #0002;transform:translateY(-1px)}
.home-icon{font-size:45px;line-height:1.3;margin-bottom:10px}
.home-tile strong{display:block;font-size:16px;font-weight:500;margin-bottom:5px}
.home-tile small{display:block;color:#999;font-size:11px;line-height:1.4}
.home-welcome{font-size:34px;text-align:center;font-weight:300;margin:10px 0 2px;color:#222}
.home-sub{text-align:center;color:#888;font-size:11px;margin:0}
@media(max-width:1050px){.home-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.login-inner{grid-template-columns:1fr}.login-illustration{font-size:55px}.login-card{padding:20px 14px}.login-title{font-size:20px}.login-field{grid-template-columns:1fr;gap:5px}.login-field label{text-align:left}.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.home-welcome{font-size:25px}}

<div class="shell" id="appShell"><aside class="side" id="side"><div class="brand"><img src="./logo.svg" alt="NEXO DIGITEX" style="display:block;width:100%;max-width:210px;height:auto;margin:0 auto 8px"><small>GESTIÓN EMPRESARIAL</small></div><div class="company"><label>EMPRESA ACTIVA</label><select id="co"></select><button id="newCo">＋ Agregar empresa</button></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦　Resumen</button><button data-page="pos">▣　Punto de venta</button><button data-page="products">▤　Productos e inventario</button><button data-page="customers">♙　Clientes</button><button data-page="suppliers">♧　Proveedores</button><button data-page="cash">▣　Caja</button><button data-page="purchases">⇩　Compras</button><button data-page="quotes">▧　Cotizaciones</button><button data-page="receivables">◷　Cuentas por cobrar</button><button data-page="expenses">↘　Gastos</button><button data-page="returns">↩　Devoluciones y cambios</button><button data-page="tickets">▤　Tickets de venta</button><button data-page="giftcards">▣　Tarjetas de regalo</button><button data-page="refunds">↶　Devoluciones de dinero</button><button data-page="guides">⇥　Guías de remisión</button><button data-page="prices">＄　Listas de precios</button><button data-page="promotions">％　Promociones y descuentos</button><button data-page="users">♙　Usuarios y equipo</button><button data-page="audit">☷　Auditoría</button><button data-page="reports">▥　Reportes</button><button data-page="settings">⚙　Configuración</button></nav><div class="foot">● Funcionamiento local<br><br>Versión inicial 0.1.0</div></aside><main class="main"><header class="top"><div><button class="btn mobile" id="toggle">☰</button>　<strong id="ptitle">Resumen</strong></div><div style="display:flex;align-items:center;gap:10px"><span class="pill" id="network">● Local</span><span class="user" id="signedUser">　Administrador</span><button class="btn" id="logoutBtn" type="button">Cerrar sesión</button></div></header><section class="content" id="view"></section><footer class="footer">NEXO DIGITEX · Base inicial independiente</footer></main></div><div id="toast" class="toast"></div><dialog id="modal"><form id="form" method="dialog"><div class="modalhead"><h2 id="mtitle">Registro</h2><button class="btn" value="cancel">×</button></div><div class="modalbody" id="mbody"></div><div class="modalfoot"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" id="save" value="default">Guardar</button></div></form></dialog>

<script>
(()=>{'use strict';const KEY='nova_digitex_fresh_v1',money=n=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),$=id=>document.getElementById(id);const fresh=()=>({companies:[{id:uid(),name:'Mi empresa',rubro:'Comercio general'}],active:'',products:[],customers:[],suppliers:[],sales:[],cash:[],purchases:[],quotes:[],expenses:[],receivables:[],returns:[],users:[],audit:[],giftcards:[],guides:[],promotions:[],priceLists:[],cashClosings:[],cashOpen:false,opening:0,settings:{igv:18,taxId:''}});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}if(!s.companies?.length)s=fresh();for(const k of ['products','customers','suppliers','sales','cash','purchases','quotes','expenses','receivables','returns','users','audit','giftcards','guides','promotions','priceLists','cashClosings'])if(!Array.isArray(s[k]))s[k]=[];if(!s.active)s.active=s.companies[0].id;let page='dashboard',term='',cart=[];const co=()=>s.companies.find(x=>x.id===s.active)||s.companies[0],sales=()=>s.sales.filter(x=>x.company===s.active),products=()=>s.products.filter(x=>x.company===s.active);function save(){localStorage.setItem(KEY,JSON.stringify(s));scheduleCloudSync();$('co').innerHTML=s.companies.map(c=>'<option value="'+c.id+'" '+(c.id===s.active?'selected':'')+'>'+esc(c.name)+'</option>').join('')}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}function button(t,a,cls='primary'){return '<button class="btn '+(cls==='primary'?'primary':'')+'" data-a="'+a+'">'+t+'</button>'}function head(t,d,actions=''){return '<div class="head"><div><div class="eyebrow">NEXO DIGITEX / '+t+'</div><h1>'+t+'</h1><p>'+d+'</p></div><div class="actions">'+actions+'</div></div>'}function stat(l,v,n){return '<div class="card"><div class="label">'+l+'</div><div class="value">'+v+'</div><div class="hint">'+n+'</div></div>'}function table(rows,heads){if(!rows.length)return '<div class="empty"><b>No hay registros todavía</b>Los datos que registres aparecerán aquí.</div>';return '<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}function recent(){return table(sales().slice().reverse().slice(0,6).map(x=>'<tr><td><b>'+esc(x.number)+'</b></td><td>'+new Date(x.date).toLocaleString('es-PE')+'</td><td>'+esc(x.payment)+'</td><td><b>'+money(x.total)+'</b></td></tr>'),['Venta','Fecha','Pago','Total'])}function dashboard(){let tiles=[['🛍️','Realizar una venta','Hacer una venta al contado o un apartado','goto-pos'],['📒','Ver inventario','Registrar, eliminar o actualizar detalles de productos','goto-products'],['👥','Mis clientes','Registrar, eliminar o actualizar detalles de clientes','goto-customers'],['💵','Abonos','Registrar pagos y consultar cuentas por cobrar','goto-receivables'],['🪙','Caja','Registrar entradas y salidas de efectivo','goto-cash'],['📊','Escritorio','Resumen de todos los movimientos de la tienda','goto-reports'],['📈','Gráficas','Comparar ventas y productos más vendidos','goto-reports'],['🛡️','Reportes','Ver reportes de caja, ventas y apartados','goto-reports'],['👤','Usuarios','Administrar usuarios y equipo','goto-users'],['▥','Códigos de barras','Gestionar productos y códigos del catálogo','goto-products'],['⚙️','Ajustes','Cambiar datos de empresa y configuración','goto-settings']];return '<h1 class="home-welcome">Bienvenido. Elija una opción</h1><p class="home-sub">Recuerde que puede explorar el menú completo haciendo clic en la parte superior izquierda</p><div class="home-grid">'+tiles.map(t=>'<button class="home-tile" data-a="'+t[3]+'"><div class="home-icon">'+t[0]+'</div><strong>'+t[1]+'</strong><small>'+t[2]+'</small></button>').join('')+'</div><div class="notice"><strong>Estado del $('supabaseSignup').insertAdjacentHTML('afterend','<button type="button" class="btn" id="supabaseRecover" style="width:100%;margin-top:8px">Recuperar contraseña por correo</button>');
$('supabaseRecover').insertAdjacentHTML('afterend','<button type="button" class="btn" id="localAccessBtn" style="width:100%;margin-top:8px">Acceder en este dispositivo (sin nube)</button><button type="button" class="btn" id="resetLocalAccessBtn" style="width:100%;margin-top:8px">Restablecer acceso local sin borrar ventas</button><p class="hint" style="margin:8px 0">El acceso local guarda datos solo en este navegador; no sincroniza con otros dispositivos. Restablecerlo elimina solo la credencial local, no los registros comerciales.</p>');
$('resetLocalAccessBtn').addEventListener('click',()=>{if(!confirm('Se quitará únicamente la credencial local de este navegador. Los productos, ventas y demás datos guardados no se borrarán. ¿Continuar?'))return;localStorage.removeItem(AUTH_KEY);sessionStorage.removeItem(AUTH_SESSION);$('loginUser').value='';$('loginPassword').value='';$('loginError').textContent='Acceso local restablecido. Escribe el correo/usuario y una contraseña de al menos 10 caracteres; luego pulsa “Acceder en este dispositivo (sin nube)”.';showLogin();});
$('localAccessBtn').addEventListener('click',async()=>{const u=$('loginUser').value.trim(),p=$('loginPassword').value,err=$('loginError'),account=authAccount(),b=$('localAccessBtn');err.textContent='';if(!u||!p){err.textContent='Escribe un usuario/correo y una contraseña para el acceso local.';return}if(p.length<10){err.textContent='Para crear el acceso local, la contraseña debe tener al menos 10 caracteres.';return}b.disabled=true;try{if(account){if(u.toLowerCase()!==String(account.username).toLowerCase()){err.textContent='Este dispositivo ya tiene un administrador local con otro usuario. Usa ese usuario o borra los datos locales solo si entiendes que podrías perder información.';return}const hash=await passwordHash(p,account.salt);if(hash!==account.hash){err.textContent='La contraseña local de este dispositivo no coincide.';return}await enterApp(account.username);toast('Acceso local iniciado; no hay sincronización en nube.');return}if(!crypto?.subtle)throw new Error('Abre el sitio mediante HTTPS para crear el acceso local.');const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('');const hash=await passwordHash(p,salt);localStorage.setItem(AUTH_KEY,JSON.stringify({username:u,salt,hash,createdAt:new Date().toISOString(),mode:'local'}));logAudit('Crear administrador local',u);await enterApp(u);toast('Acceso local creado. Los datos quedan en este dispositivo.')}catch(ex){err.textContent=ex.message||'No se pudo crear el acceso local.'}finally{b.disabled=false}});
$('supabaseRecover').addEventListener('click',async()=>{const sb=initSupabase(),email=$('loginUser').value.trim(),err=$('loginError');err.textContent='';if(!sb){err.textContent='No se pudo cargar el servicio de autenticación. Recarga la página.';return}if(!email||!email.includes('@')){err.textContent='Escribe primero el correo registrado en Supabase.';return}const b=$('supabaseRecover');b.disabled=true;try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;err.textContent='Si el correo está registrado, recibirás un enlace para restablecer la contraseña. Revisa también Spam.';}catch(ex){err.textContent='No se pudo enviar la recuperación: '+(ex.message||'inténtalo de nuevo');}finally{b.disabled=false}});

$('view').addEventListener('submit',async e=>{if(e.target.id==='supabaseSettings'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(d.url.trim())){toast('La URL debe ser https://tu-proyecto.supabase.co');return}localStorage.setItem('nexo_supabase_config',JSON.stringify({url:d.url.trim().replace(/\/$/,''),key:d.key.trim()}));initSupabase();toast('Configuración guardada. Ejecuta el SQL y prueba la conexión.');render()}});
$('view').addEventListener('click',async e=>{if(e.target.id==='testSupabase'){try{const sb=initSupabase();if(!sb)throw Error('Configura URL y clave pública');const {error}=await sb.from('nexodigitex_state').select('user_id').limit(1);if(error)throw error;toast('Conexión y tabla Supabase disponibles')}catch(ex){toast('Supabase: '+ex.message)}}});
if(sessionStorage.getItem(AUTH_SESSION)){enterApp(sessionStorage.getItem(AUTH_SESSION))}else{showLogin()}
if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
